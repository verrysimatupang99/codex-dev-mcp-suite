name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install deps for each server
        run: |
          for s in project-memory checkpoint context-pack devjournal; do
            (cd "$s" && npm install --no-audit --no-fund)
          done

      - name: Run test suite (offline)
        run: node run-tests.mjs

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Pack tarball
        run: npm pack --silent

      - name: Install tarball in temp project
        run: |
          set -euo pipefail
          EXPECTED="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')"
          TARBALL="$(ls codex-dev-mcp-suite-*.tgz)"
          TMP="$(mktemp -d)"
          cp "$TARBALL" "$TMP/"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "./$TARBALL" --no-audit --no-fund
          for bin in project-memory devjournal checkpoint context-pack; do
            GOT="$(node "./node_modules/codex-dev-mcp-suite/bin/$bin.mjs" --version)"
            echo "$bin -> $GOT"
            test "$GOT" = "$EXPECTED"
          done
          node "./node_modules/codex-dev-mcp-suite/bin/init.mjs" --dry-run
