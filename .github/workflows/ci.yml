name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install deps for each server
        run: |
          for s in project-memory checkpoint context-pack devjournal; do
            (cd "$s" && npm install --no-audit --no-fund)
          done

      - name: Run test suite (offline)
        run: node run-tests.mjs
