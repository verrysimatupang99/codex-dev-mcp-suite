name: Publish to NPM

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies across all servers
        run: |
          for s in project-memory checkpoint context-pack devjournal armada; do
            (cd "$s" && npm install --no-audit --no-fund)
          done

      - name: Run test suite
        run: node run-tests.mjs

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; Node 20 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g "npm@^11.5.1"

      # No NODE_AUTH_TOKEN on purpose: npm exchanges the GitHub OIDC id-token
      # for a publish credential via the trusted publisher configured on the
      # package (MaximaLabs/dev-mcp-suite + publish.yml).
      - name: Publish to NPM
        run: npm publish --provenance --access public
